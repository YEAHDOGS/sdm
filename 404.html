<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the jungle — SDM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070c07">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#070c07;--ink:#f3eddd;--mut:#a7b096;--amber:#f0a53c;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
.k{font-family:var(--mono);font-size:.72rem;letter-spacing:.3em;color:var(--amber);text-transform:uppercase;margin-bottom:1rem}
h1{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(2.4rem,10vw,4.5rem);line-height:1.05}
p{color:var(--mut);margin:1.2rem auto;max-width:36ch}
a.btn{display:inline-block;background:var(--amber);color:#0a0a06;font-weight:700;text-decoration:none;padding:.95rem 1.7rem;border-radius:6px}
</style>
</head>
<body>
<main>
<p class="k">404</p>
<h1>Lost in the jungle.</h1>
<p>This trail doesn't exist. The pack is back at camp.</p>
<a class="btn" href="./">Back to SDM</a>
</main>
</body>
</html>
